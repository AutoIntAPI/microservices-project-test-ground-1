name: CI/CD Pipeline

on:
  push:
    branches: [ main, develop ]
  pull_request:
    branches: [ main, develop ]

jobs:
  test-api-gateway:
    name: Test API Gateway
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v3
      
      - name: Setup Node.js
        uses: actions/setup-node@v3
        with:
          node-version: '18'
          
      - name: Install dependencies
        working-directory: ./services/api-gateway
        run: npm ci
        
      - name: Run linting
        working-directory: ./services/api-gateway
        run: npm run lint || true
        
      - name: Run tests
        working-directory: ./services/api-gateway
        run: npm test || true

  test-user-service:
    name: Test User Service
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v3
      
      - name: Setup Node.js
        uses: actions/setup-node@v3
        with:
          node-version: '18'
          
      - name: Install dependencies
        working-directory: ./services/user-service
        run: npm ci
        
      - name: Run tests
        working-directory: ./services/user-service
        run: npm test || true

  test-product-service:
    name: Test Product Service
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v3
      
      - name: Setup Node.js
        uses: actions/setup-node@v3
        with:
          node-version: '18'
          
      - name: Install dependencies
        working-directory: ./services/product-service
        run: npm ci
        
      - name: Run tests
        working-directory: ./services/product-service
        run: npm test || true

  test-python-services:
    name: Test Python Services
    runs-on: ubuntu-latest
    strategy:
      matrix:
        service: [order-service, payment-service, notification-service]
    steps:
      - uses: actions/checkout@v3
      
      - name: Setup Python
        uses: actions/setup-python@v4
        with:
          python-version: '3.11'
          
      - name: Install dependencies
        working-directory: ./services/${{ matrix.service }}
        run: |
          pip install -r requirements.txt
          pip install pytest pytest-cov flake8
          
      - name: Run linting
        working-directory: ./services/${{ matrix.service }}
        run: flake8 app/ --max-line-length=120 || true
        
      - name: Run tests
        working-directory: ./services/${{ matrix.service }}
        run: pytest || true

  build-docker-images:
    name: Build Docker Images
    runs-on: ubuntu-latest
    needs: [test-api-gateway, test-user-service, test-product-service, test-python-services]
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'
    strategy:
      matrix:
        service: [api-gateway, user-service, product-service, order-service, payment-service, notification-service]
    steps:
      - uses: actions/checkout@v3
      
      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v2
        
      - name: Build Docker image
        working-directory: ./services/${{ matrix.service }}
        run: docker build -t ${{ matrix.service }}:latest .
        
      - name: Test Docker image
        run: |
          docker run --rm ${{ matrix.service }}:latest echo "Image built successfully"

  integration-test:
    name: Integration Tests
    runs-on: ubuntu-latest
    needs: [test-api-gateway, test-user-service, test-product-service, test-python-services]
    steps:
      - uses: actions/checkout@v3
      
      - name: Start services with docker-compose
        run: docker-compose up -d
        
      - name: Wait for services
        run: sleep 30
        
      - name: Check service health
        run: |
          curl -f http://localhost:8000/health || exit 1
          curl -f http://localhost:3001/health || exit 1
          curl -f http://localhost:3002/health || exit 1
          curl -f http://localhost:3003/health || exit 1
          curl -f http://localhost:3004/health || exit 1
          curl -f http://localhost:3005/health || exit 1
          
      - name: Run integration tests
        run: |
          echo "Integration tests would run here"
          
      - name: Stop services
        run: docker-compose down
